<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Additions et soustractions · CP</title>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Calcul jusqu'à 10 avec des points pour compter : bleu = premier nombre, orange = ce qu'on ajoute, barré = ce qu'on enlève */
:root{
  --bg:#f6f3ec; --panel:#ffffff; --ink:#1f2328; --muted:#6b6f76; --line:#d9d4c7; --chip:#efeadf;
  --a:#1c7ed6; --b:#e8590c; --gone:#ced4da;
  --ok:#d3f9d8; --ok-ink:#2b8a3e; --err:#ffe3e3; --err-ink:#c92a2a; --accent:#2f9e44; --on-accent:#ffffff;
  --shadow:0 2px 10px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1b1d21; --panel:#26292e; --ink:#eceef1; --muted:#a3a8b0; --line:#3a3e45; --chip:#33373d;
    --a:#4dabf7; --b:#ff922b; --gone:#495057;
    --ok:#1e3a26; --ok-ink:#8ce99a; --err:#4a1f22; --err-ink:#ffa8a8; --accent:#37b24d;
    --shadow:0 2px 10px rgba(0,0,0,.4); color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Andika",system-ui,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none;
  display:flex;flex-direction:column;padding-block:12px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--a);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
header h1{font-size:22px;margin:0 auto 0 0}
.home,.pill{display:inline-flex;align-items:center;padding:10px 14px;border-radius:12px;background:var(--chip);font-weight:700;font-size:17px;text-decoration:none;color:inherit}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--chip);border-radius:12px;padding:4px}
.seg button{padding:8px 12px;border-radius:9px;font-size:16px;font-weight:700;background:transparent}
.seg button.on{background:var(--panel);box-shadow:var(--shadow)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.5vh,24px);padding-top:10px}
.stars{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-size:clamp(20px,3.6vw,30px)}
.stars span{opacity:.2}.stars span.on{opacity:1}.stars span.cur{opacity:.6}
.calc{font-size:clamp(64px,13vh,120px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.calc .q{display:inline-block;min-width:1.2em;text-align:center;border-bottom:6px solid var(--line)}
.calc.ok .q{color:var(--ok-ink);border-color:var(--ok-ink)}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(6px,1.2vw,12px);max-width:min(100%,760px);min-height:clamp(40px,7vh,60px);background:var(--panel);border-radius:22px;padding:14px 18px;box-shadow:var(--shadow)}
.dots i{width:clamp(34px,6vh,52px);height:clamp(34px,6vh,52px);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;color:var(--panel);font-size:24px}
.dots i.a{background:var(--a)}.dots i.b{background:var(--b)}.dots i.x{background:var(--gone);color:var(--err-ink)}
.dots .sep{width:18px}
.pad{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(6px,1.4vw,12px);width:min(100%,820px)}
.num{background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:clamp(8px,1.8vh,18px) 0;font-size:clamp(32px,5vh,50px);font-weight:700;box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
.num.ok{background:var(--ok);color:var(--ok-ink);border-color:var(--ok-ink)}
.num.bad{background:var(--err);color:var(--err-ink);border-color:var(--err-ink);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.end{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.end h2{font-size:clamp(30px,5vw,44px);margin:0}
.end .big{font-size:clamp(50px,9vw,80px);font-weight:700}
.go{background:var(--accent);color:var(--on-accent);padding:18px 30px;border-radius:18px;font-size:26px;font-weight:700;box-shadow:var(--shadow)}
.hint{color:var(--muted);font-size:15px;text-align:center;margin:0}
body.noaide .dots{visibility:hidden}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <a class="home" href="../../../index.html#cp">← CP</a>
  <h1>➕ Additions et soustractions</h1>
  <div class="seg" role="group" aria-label="Opération" id="niveaux"></div>
</header>
<main id="main"></main>
<script src="../../../assets/reglages.js?v=4"></script>
<script src="../../../assets/illus.js?v=4"></script>
<script>
const TYPES = { plus:"＋ Additions", moins:"− Soustractions", mix:"Mélange" };
const KEY = "cp-calcul-v1";
const R = Reglages.init({ key: KEY, onChange: () => partie(), niveaux: {
  facile: "Nombres jusqu'à 6, avec les points pour compter.",
  moyen: "Nombres jusqu'à 10. Les points peuvent être cachés.",
  difficile: "Jusqu'à 10, sans les points, et des calculs à trou : 3 + ? = 7." } });
const T = () => R().questions;
const $ = s => document.querySelector(s);
const lsGet = k => { try { return localStorage.getItem(k) } catch(e) { return null } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v) } catch(e) {} };
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
function add(max){ const r=rnd(2,max), a=rnd(1,r-1); return {a, b:r-a, op:"+", r} }
function sub(max){ const a=rnd(2,max), b=rnd(1,a); return {a, b, op:"−", r:a-b} }
function question(){
  const max = R().niveau==="facile" ? 6 : 10;
  const q = type==="plus" ? add(max) : type==="moins" ? sub(max) : (Math.random()<.5 ? add(max) : sub(max));
  q.trou = R().niveau==="difficile" && Math.random()<.5;   // 3 + ? = 7 : on cherche le 2e nombre
  q.rep = q.trou ? q.b : q.r;
  return q;
}
function speak(t){ try{ const u=new SpeechSynthesisUtterance(t); u.lang="fr-FR"; u.rate=.85; speechSynthesis.cancel(); speechSynthesis.speak(u) }catch(e){} }
function buzz(){ try{ navigator.vibrate&&navigator.vibrate(15) }catch(e){} }

let type = TYPES[lsGet(KEY+"-type")] ? lsGet(KEY+"-type") : "plus";
let aide = lsGet(KEY+"-aide") !== "0";
$("#niveaux").innerHTML = Object.entries(TYPES).map(([k,n])=>'<button data-n="'+k+'">'+n+'</button>').join("");
document.querySelectorAll("#niveaux button").forEach(b=>b.onclick=()=>{ type=b.dataset.n; lsSet(KEY+"-type",type); partie() });

let jeu;
function partie(){
  Reglages.stop();
  document.querySelectorAll("#niveaux button").forEach(b=>b.classList.toggle("on",b.dataset.n===type));
  jeu = { tour:0, reussis:[], essai:0, q:null, prec:"", neuf:Reglages.sansDoublon() };
  tour();
}
function points(q){
  if (q.op==="+") return '<i class="a"></i>'.repeat(q.a) + '<span class="sep"></span>' + '<i class="b"></i>'.repeat(q.b);
  return '<i class="a"></i>'.repeat(q.a-q.b) + '<i class="x">✕</i>'.repeat(q.b);
}
function etoiles(){
  return '<div class="stars">' + Array.from({length:T()},(_,i)=>'<span class="'+(i<jeu.tour?(jeu.reussis[i]?"on":""):(i===jeu.tour?"cur":""))+'">⭐</span>').join("") + '</div>';
}
function tour(){
  if (jeu.tour>=T()) return fin();
  const q = jeu.neuf(question, x => x.a+x.op+x.b+(x.trou?"t":""));   // jamais deux fois le même calcul
  jeu.q=q; jeu.prec=q.a+q.op+q.b; jeu.essai=0;
  const difficile = R().niveau==="difficile", montrer = aide && !difficile && !q.trou;
  document.body.classList.toggle("noaide",!montrer);
  const ligne = q.trou ? q.a+' '+q.op+' <span class="q" id="q">?</span> = '+q.r : q.a+' '+q.op+' '+q.b+' = <span class="q" id="q">?</span>';
  $("#main").innerHTML = etoiles() +
    '<div class="calc" id="calc">'+ligne+'</div>' +
    '<div class="dots" aria-hidden="true">'+(q.trou?"":points(q))+'</div>' +
    '<div class="pad">' + Array.from({length:11},(_,n)=>'<button class="num" data-n="'+n+'">'+n+'</button>').join("") + '</div>' +
    '<div class="tools">'+(difficile?'':'<button class="pill" id="bAide">'+(aide?"🙈 Cacher les points":"👀 Montrer les points")+'</button>') +
    '<button class="pill" id="bSay">🔊 Écouter</button></div>';
  const mot = q.op==="+"?" plus ":" moins ";
  const phrase = q.trou ? q.a+mot+"combien égale "+q.r : q.a+mot+q.b;
  const complet = q.a+mot+q.b+" égale "+q.r;
  $("#bSay").onclick=()=>speak(phrase);
  if ($("#bAide")) $("#bAide").onclick=()=>{ aide=!aide; lsSet(KEY+"-aide",aide?"1":"0"); document.body.classList.toggle("noaide",!aide); $("#bAide").textContent=aide?"🙈 Cacher les points":"👀 Montrer les points" };
  const bons = () => { $("#q").textContent=q.rep; $("#calc").classList.add("ok"); document.querySelectorAll(".num").forEach(x=>x.disabled=true) };
  Reglages.chrono(()=>{ jeu.reussis[jeu.tour]=false; jeu.tour++; bons(); document.querySelector('.num[data-n="'+q.rep+'"]').classList.add("ok"); setTimeout(tour,1600) });
  document.querySelectorAll(".num").forEach(b=>b.onclick=()=>{
    if (+b.dataset.n===q.rep) {
      Reglages.stop(); b.classList.add("ok"); bons(); buzz();
      Reglages.parler(complet,"succes");
      jeu.reussis[jeu.tour]=jeu.essai===0; jeu.tour++;
      setTimeout(tour,1300);
    } else { jeu.essai++; b.classList.remove("bad"); void b.offsetWidth; b.classList.add("bad");
      Reglages.parler("Non. "+phrase+", ça ne fait pas "+b.dataset.n+". "+(q.trou?"Compte à partir de "+q.a+".":"Compte bien les points."),"erreur") }
  });
}
function fin(){
  const T_=T(), n=jeu.reussis.filter(Boolean).length, k=KEY+"-best-"+type+"-"+R().niveau, best=Math.max(n,+(lsGet(k)||0)); lsSet(k,best);
  const msg = n===T_ ? "Parfait ! 🎉" : n>=T_*.7 ? "Très bien !" : n>=T_/2 ? "Bien !" : "On continue !";
  $("#main").innerHTML='<div class="end"><h2>'+msg+'</h2><div class="big">'+n+' / '+T_+' ⭐</div>' +
    '<p class="hint">'+TYPES[type]+' · trouvés du premier coup · Record : '+best+' / '+T_+'</p><button class="go" id="bAgain">▶ Rejouer</button></div>';
  $("#bAgain").onclick=partie;
}
partie();
</script>
</body>
</html>
