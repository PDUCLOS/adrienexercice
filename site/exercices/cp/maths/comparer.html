<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Plus grand, plus petit · CP</title>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Comparer deux nombres avec <, > ou =, et trouver le nombre caché sur une droite graduée */
:root{
  --bg:#f6f3ec; --panel:#ffffff; --ink:#1f2328; --muted:#6b6f76; --line:#d9d4c7; --chip:#efeadf;
  --a:#1c7ed6; --b:#e8590c; --croco:#2b8a3e; --croco-soft:#ebfbee;
  --ok:#d3f9d8; --ok-ink:#2b8a3e; --err:#ffe3e3; --err-ink:#c92a2a; --accent:#2b8a3e; --on-accent:#ffffff;
  --shadow:0 2px 10px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1b1d21; --panel:#26292e; --ink:#eceef1; --muted:#a3a8b0; --line:#3a3e45; --chip:#33373d;
    --a:#4dabf7; --b:#ff922b; --croco:#69db7c; --croco-soft:#1e3a26;
    --ok:#1e3a26; --ok-ink:#8ce99a; --err:#4a1f22; --err-ink:#ffa8a8; --accent:#37b24d;
    --shadow:0 2px 10px rgba(0,0,0,.4); color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Andika",system-ui,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none;
  display:flex;flex-direction:column;padding-block:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--a);outline-offset:2px}
button:disabled{cursor:default}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
header h1{font-size:22px;margin:0 auto 0 0}
.home,.pill{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:12px;background:var(--chip);font-weight:700;font-size:17px;text-decoration:none;color:inherit;min-height:48px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2.2vh,22px);padding-top:8px;width:min(100%,1100px);margin:0 auto}
.stars{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-size:clamp(18px,3.2vw,28px)}
.stars span{opacity:.2}.stars span.on{opacity:1}.stars span.cur{opacity:.6}
.consigne{font-size:clamp(18px,2.8vh,24px);color:var(--muted);margin:0;text-align:center}
/* comparaison : nombre · case · nombre */
.duel{display:flex;align-items:center;justify-content:center;gap:clamp(10px,2.4vw,28px)}
.cote{background:var(--panel);border-radius:24px;box-shadow:var(--shadow);padding:clamp(8px,1.8vh,16px) clamp(12px,2vw,22px);display:flex;flex-direction:column;align-items:center;gap:6px;min-width:clamp(120px,18vw,200px)}
.cote b{font-size:clamp(56px,11vh,100px);line-height:1;font-variant-numeric:tabular-nums}
.cote.ca b{color:var(--a)}.cote.cb b{color:var(--b)}
.tas{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;font-size:clamp(24px,4.6vh,40px);line-height:1.05;min-height:2.1em;align-content:center}
.case{width:clamp(80px,13vh,120px);height:clamp(80px,13vh,120px);border:5px dashed var(--line);border-radius:20px;display:flex;align-items:center;justify-content:center;
  font-size:clamp(56px,10vh,90px);font-weight:700;color:var(--muted);line-height:1}
.case.ok{border-style:solid;border-color:var(--ok-ink);color:var(--ok-ink);background:var(--ok)}
.signes{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,2vw,22px);width:min(100%,720px)}
.signes button{background:var(--panel);border:4px solid var(--line);border-radius:22px;box-shadow:var(--shadow);min-height:clamp(84px,15vh,130px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.signes b{font-size:clamp(48px,9vh,80px);line-height:1}
.signes small{font-size:clamp(15px,2.2vh,19px);font-weight:700;color:var(--muted)}
/* droite graduée */
.droite{background:var(--panel);border-radius:24px;box-shadow:var(--shadow);padding:clamp(16px,3vh,28px) clamp(16px,3vw,36px) clamp(10px,2vh,18px);width:min(100%,900px)}
.graduation{display:grid;grid-template-columns:repeat(5,1fr);position:relative}
.graduation::before{content:"";position:absolute;left:0;right:0;top:20px;border-top:6px solid var(--ink);border-radius:3px}
.graduation::after{content:"";position:absolute;right:-14px;top:11px;border:12px solid transparent;border-left:18px solid var(--ink);border-right:0}
.tick{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.tick i{width:6px;height:46px;background:var(--ink);border-radius:3px}
.tick b{font-size:clamp(38px,7vh,62px);line-height:1;font-variant-numeric:tabular-nums}
.tick .q{display:inline-flex;justify-content:center;min-width:1.6em;border:4px dashed var(--a);border-radius:14px;color:var(--a);padding:0 .1em}
.tick .q.ok{border-style:solid;border-color:var(--ok-ink);color:var(--ok-ink);background:var(--ok)}
.pas{position:absolute;top:-6px;left:50%;width:100%;text-align:center;font-size:clamp(14px,2vh,18px);font-weight:700;color:var(--muted)}
.choix{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,2vw,22px);width:min(100%,640px)}
.choix button{background:var(--panel);border:4px solid var(--line);border-radius:22px;box-shadow:var(--shadow);min-height:clamp(80px,13vh,110px);font-size:clamp(40px,7vh,62px);font-weight:700;font-variant-numeric:tabular-nums}
.ok-b{background:var(--ok)!important;color:var(--ok-ink);border-color:var(--ok-ink)!important}
.bad-b{background:var(--err)!important;color:var(--err-ink);border-color:var(--err-ink)!important;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.msg{font-size:clamp(18px,2.6vh,24px);text-align:center;min-height:1.4em;margin:0;font-weight:700}
.msg.err{color:var(--err-ink)}.msg b{color:var(--ok-ink);font-variant-numeric:tabular-nums}
.astuce{background:var(--croco-soft);color:var(--croco);border-radius:16px;padding:8px 16px;font-size:clamp(17px,2.4vh,22px);font-weight:700;margin:0;text-align:center}
.astuce[hidden]{display:none}
.tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.end{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.end h2{font-size:clamp(30px,5vw,44px);margin:0}
.end .big{font-size:clamp(50px,9vw,80px);font-weight:700}
.go{background:var(--accent);color:var(--on-accent);padding:18px 30px;border-radius:18px;font-size:26px;font-weight:700;box-shadow:var(--shadow)}
.hint{color:var(--muted);font-size:15px;text-align:center;margin:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <a class="home" href="../../../index.html#cp">← CP</a>
  <h1>🐊 Plus grand, plus petit</h1>
</header>
<main id="main"></main>
<script src="../../../assets/reglages.js?v=5"></script>
<script src="../../../assets/illus.js?v=5"></script>
<script>
/* GEN-DEBUT : fonctions pures (testées hors page) */
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const melange = a => { for (let i=a.length-1;i>0;i--){ const j=rnd(0,i); [a[i],a[j]]=[a[j],a[i]] } return a };
const SIGNES = ["<","=",">"];
const MOTS = { "<":"plus petit que", "=":"égal à", ">":"plus grand que" };
const OBJETS = ["🍎","⭐","🐟","🎈","🍓","🚗","🌸","⚽","🐞","🍪"];
const maxNiv = niv => niv==="facile" ? 10 : niv==="moyen" ? 30 : 59;
const signe = (a,b) => a<b ? "<" : a>b ? ">" : "=";
function genSigne(niv){
  const max = maxNiv(niv), r = Math.random();
  let a = rnd(1,max), b;
  if (r<.18) b = a;                                                   // égalité
  else if (niv!=="facile" && r<.5 && a>=10 && Math.min(Math.floor(a/10)*10+9,max) > Math.floor(a/10)*10){   // même dizaine : on regarde les unités
    const d = Math.floor(a/10)*10; do { b = d + rnd(0,9) } while (b===a || b>max || b<1);
  } else if (niv!=="facile" && r<.65 && a>=10 && a%10 && a%10!==Math.floor(a/10) && (a%10)*10+Math.floor(a/10)<=max){
    b = (a%10)*10 + Math.floor(a/10);                                 // chiffres inversés : 23 et 32
  } else { do { b = rnd(1,max) } while (b===a) }
  const rep = signe(a,b), q = { mode:"signe", a, b, rep, choix:SIGNES.slice() };
  if (niv==="facile") q.objet = OBJETS[rnd(0,OBJETS.length-1)];
  const da = Math.floor(a/10), db = Math.floor(b/10);
  const grand = Math.max(a,b), petit = Math.min(a,b);
  if (rep==="=") q.dire = "Non. "+a+" et "+b+", c'est pareil : on met égal.";
  else if (niv!=="facile" && da!==db) q.dire = "Non. "+grand+" a "+Math.floor(grand/10)+" dizaine"+(grand>=20?"s":"")+", "+petit+" en a "+Math.floor(petit/10)+". "+a+" est "+MOTS[rep]+" "+b+".";
  else if (niv!=="facile") q.dire = "Non. Même nombre de dizaines : on regarde les unités. "+a+" est "+MOTS[rep]+" "+b+".";
  else q.dire = "Non. "+a+" est "+MOTS[rep]+" "+b+". Le crocodile ouvre la bouche vers "+grand+".";
  q.texte = a+" "+rep+" "+b+" : "+a+" est "+MOTS[rep]+" "+b;
  q.succes = a+" est "+MOTS[rep]+" "+b;
  q.consigne = "Compare "+a+" et "+b+". Plus petit, égal ou plus grand ?";
  return q;
}
function genDroite(){
  const pas = Math.random()<.5 ? 1 : 10;
  let debut;
  if (pas===1) debut = rnd(0,55);
  else { const o = rnd(0,9); debut = Math.random()<.5 ? o : o+10 }  // 3, 13, 23, 33, 43
  const ticks = Array.from({length:5},(_,i)=>debut+i*pas), h = rnd(1,4), rep = ticks[h];
  const inv = (rep%10)*10 + Math.floor(rep/10);
  const pieges = melange([rep+1, rep-1, rep+10, rep-10, inv].filter((x,i,t)=>x>=0 && x<=59 && x!==rep && t.indexOf(x)===i));
  const choix = [rep, pieges[0], pieges[1]].sort((x,y)=>x-y);
  return { mode:"droite", pas, debut, h, ticks, rep, choix,
    dire: "Non. On compte de "+pas+" en "+pas+" : "+ticks.join(", ")+".",
    texte: "De "+pas+" en "+pas+" : "+ticks.join(" · "),
    succes: ticks.join(", "),
    consigne: "Quel nombre est caché sur la droite ? On compte de "+pas+" en "+pas+"." };
}
function genere(niv){ return niv==="difficile" && Math.random()<.5 ? genDroite() : genSigne(niv) }
const cle = q => q.mode==="signe" ? "s|"+q.a+"|"+q.b : "d|"+q.pas+"|"+q.debut+"|"+q.h;
function serie(niv, n, neuf){
  const liste = [];
  for (let i=0;i<n;i++) liste.push(neuf(() => genere(niv), cle));
  return liste;
}
/* GEN-FIN */

const KEY = "cp-comparer-v1";
const R = Reglages.init({ key: KEY, onChange: () => partie(), niveaux: {
  facile: "Nombres jusqu'à 10, avec les objets dessinés.",
  moyen: "Nombres jusqu'à 30.",
  difficile: "Nombres jusqu'à 59, et le nombre caché sur une droite graduée (de 1 en 1 ou de 10 en 10)." } });
const T = () => R().questions;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/</g,"&lt;").replace(/>/g,"&gt;");
const lsGet = k => { try { return localStorage.getItem(k) } catch(e) { return null } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v) } catch(e) {} };
function buzz(){ try{ navigator.vibrate&&navigator.vibrate(15) }catch(e){} }

let jeu = null, numSerie = 0;
function plusTard(fn, ms){ const id = jeu.id; setTimeout(() => { if (jeu && jeu.id===id) fn() }, ms) }
function etoiles(){
  return '<div class="stars">' + Array.from({length:T()},(_,i)=>'<span class="'+(i<jeu.tour?(jeu.res[i]?"on":""):(i===jeu.tour?"cur":""))+'">⭐</span>').join("") + '</div>';
}
function partie(){
  Reglages.stop();
  const niv = R().niveau;
  jeu = { id: ++numSerie, niv, tour:0, res:[], liste: serie(niv, T(), Reglages.sansDoublon()) };
  tour();
}
const tas = (n, o) => '<div class="tas" aria-hidden="true">' + ('<span class="illus">'+o+'</span>').repeat(n) + '</div>';
function vueSigne(q){
  const cote = (n, c) => '<div class="cote '+c+'"><b>'+n+'</b>'+(q.objet ? tas(n, q.objet) : '')+'</div>';
  return '<p class="consigne">Plus petit, égal ou plus grand ?</p>' +
    '<div class="duel">'+cote(q.a,"ca")+'<div class="case" id="case">?</div>'+cote(q.b,"cb")+'</div>' +
    '<div class="signes">' + q.choix.map(s=>'<button data-v="'+esc(s)+'" aria-label="'+MOTS[s]+'"><b>'+esc(s)+'</b><small>'+MOTS[s].replace(/ (que|à)$/,"")+'</small></button>').join("") + '</div>';
}
function vueDroite(q){
  return '<p class="consigne">Quel nombre est caché ?</p>' +
    '<div class="droite"><div class="graduation">' + q.ticks.map((t,i)=>'<div class="tick">'+(i<4?'<span class="pas">+'+q.pas+'</span>':'')+'<i></i><b>'+(i===q.h?'<span class="q" id="case">?</span>':t)+'</b></div>').join("") + '</div></div>' +
    '<div class="choix">' + q.choix.map(n=>'<button data-v="'+n+'">'+n+'</button>').join("") + '</div>';
}
function tour(){
  if (jeu.tour>=T()) return fin();
  const q = jeu.liste[jeu.tour]; let fini = false;
  const astuce = q.mode==="signe" ? "🐊 Le crocodile ouvre la bouche vers le plus grand : 8 &gt; 3 et 3 &lt; 8."
    : "🐊 Regarde les nombres à côté : on avance de "+q.pas+" à chaque trait.";
  $("#main").innerHTML = etoiles() + (q.mode==="signe" ? vueSigne(q) : vueDroite(q)) +
    '<p class="msg" id="msg" aria-live="polite"></p>' +
    '<p class="astuce" id="astuce" hidden>'+astuce+'</p>' +
    '<div class="tools"><button class="pill" id="bAstuce">🐊 Astuce</button><button class="pill" id="bSay">🔊 Écouter</button></div>';
  $("#bAstuce").onclick = () => { $("#astuce").hidden = !$("#astuce").hidden };
  $("#bSay").onclick = () => Reglages.parler(q.consigne, "consigne");
  const btns = [...document.querySelectorAll(".signes button,.choix button")];
  const bonBtn = () => btns.find(b => b.dataset.v===String(q.rep));
  const finir = ok => {
    if (fini) return; fini = true; Reglages.stop();
    btns.forEach(b => b.disabled = true);
    const c = $("#case"); c.textContent = q.rep; c.classList.add("ok");
    jeu.res[jeu.tour] = ok; jeu.tour++;
    plusTard(tour, ok ? 1300 : 4000);
  };
  const erreur = () => {
    bonBtn().classList.add("ok-b");
    $("#msg").className = "msg err"; $("#msg").innerHTML = "C'était <b>"+esc(q.rep)+"</b> · "+esc(q.texte);
    Reglages.parler(q.dire, "erreur");
    finir(false);
  };
  Reglages.chrono(erreur);
  btns.forEach(b => b.onclick = () => {
    if (fini) return;
    if (b.dataset.v===String(q.rep)){ b.classList.add("ok-b"); buzz(); Reglages.parler(q.succes, "succes"); finir(true) }
    else { b.classList.add("bad-b"); erreur() }
  });
}
function fin(){
  const T_=T(), n=jeu.res.filter(Boolean).length, k=KEY+"-best-"+jeu.niv, best=Math.max(n,+(lsGet(k)||0)); lsSet(k,best);
  const msg = n===T_ ? "Parfait ! 🎉" : n>=T_*.7 ? "Très bien !" : n>=T_/2 ? "Bien !" : "On continue !";
  $("#main").innerHTML='<div class="end"><h2>'+msg+'</h2><div class="big">'+n+' / '+T_+' ⭐</div>' +
    '<p class="hint">Trouvés du premier coup · Record : '+best+' / '+T_+'</p><button class="go" id="bAgain">▶ Rejouer</button></div>';
  $("#bAgain").onclick=partie;
}
partie();
</script>
</body>
</html>
