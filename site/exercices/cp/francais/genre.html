<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Masculin ou féminin · CP</title>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Playwrite+FR+Moderne:wght@400&display=swap" rel="stylesheet">
<style>
/* Masculin ou féminin avec les mots vedettes : un / une, le / la, il / elle */
:root{
  --bg:#f6f3ec; --panel:#ffffff; --ink:#1f2328; --muted:#6b6f76; --line:#d9d4c7; --chip:#efeadf;
  --mas:#1971c2; --mas-soft:#e7f1fc; --fem:#c2255c; --fem-soft:#fdeef4;
  --ok:#d3f9d8; --ok-ink:#2b8a3e; --err:#ffe3e3; --err-ink:#c92a2a; --accent:#7048e8; --on-accent:#ffffff;
  --shadow:0 2px 10px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1b1d21; --panel:#26292e; --ink:#eceef1; --muted:#a3a8b0; --line:#3a3e45; --chip:#33373d;
    --mas:#4dabf7; --mas-soft:#1d2d3d; --fem:#f06595; --fem-soft:#3a1f2a;
    --ok:#1e3a26; --ok-ink:#8ce99a; --err:#4a1f22; --err-ink:#ffa8a8; --accent:#9775fa;
    --shadow:0 2px 10px rgba(0,0,0,.4); color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Andika",system-ui,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none;
  display:flex;flex-direction:column;min-height:100vh;padding-block:12px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
header h1{font-size:22px;margin:0 auto 0 0}
.home,.pill{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:12px;background:var(--chip);font-weight:700;font-size:17px;text-decoration:none;color:inherit}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--chip);border-radius:12px;padding:4px}
.seg button{padding:8px 12px;border-radius:9px;font-size:16px;font-weight:700;background:transparent}
.seg button.on{background:var(--panel);box-shadow:var(--shadow)}
.seg .cur{font-family:"Playwrite FR Moderne","Andika",cursive;font-weight:400;font-size:14px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,3vh,26px);padding-top:10px;width:min(100%,1000px);margin:0 auto}
.stars{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-size:clamp(20px,3.6vw,30px)}
.stars span{opacity:.2}.stars span.on{opacity:1}.stars span.cur{opacity:.6}
.consigne{font-size:clamp(18px,2.6vw,24px);color:var(--muted);margin:0;text-align:center}
.carte{background:var(--panel);border-radius:28px;box-shadow:var(--shadow);padding:clamp(14px,3vh,28px) clamp(20px,4vw,48px);display:flex;flex-direction:column;align-items:center;gap:6px}
.pic{font-size:clamp(90px,18vh,170px);line-height:1}
.phrase{font-size:clamp(34px,5.4vw,58px);font-weight:700;text-align:center}
.trou{display:inline-flex;justify-content:center;min-width:2.6ch;padding:0 .25em;border-radius:12px;border:4px dashed var(--line);color:var(--muted)}
.trou.mas{border-style:solid;border-color:var(--mas);color:var(--mas);background:var(--mas-soft)}
.trou.fem{border-style:solid;border-color:var(--fem);color:var(--fem);background:var(--fem-soft)}
body.cursive .phrase,body.cursive .choix b{font-family:"Playwrite FR Moderne","Andika",cursive;font-weight:400}
.choix{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2.4vw,24px);width:min(100%,760px)}
.choix button{border-radius:24px;padding:clamp(14px,2.6vh,24px) 10px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:4px;border:4px solid transparent}
.choix .m{background:var(--mas-soft);color:var(--mas)}
.choix .f{background:var(--fem-soft);color:var(--fem)}
.choix b{font-size:clamp(44px,7vh,68px);line-height:1.1}
.choix small{font-size:18px;font-weight:700;opacity:.85}
.choix button.ok{border-color:var(--ok-ink);background:var(--ok);color:var(--ok-ink)}
.choix button.bad{border-color:var(--err-ink);background:var(--err);color:var(--err-ink);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.astuce{font-size:clamp(18px,2.4vw,22px);text-align:center;min-height:1.5em;margin:0}
.astuce b.m{color:var(--mas)}.astuce b.f{color:var(--fem)}
.tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.end{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.end h2{font-size:clamp(30px,5vw,44px);margin:0}
.big{font-size:clamp(50px,9vw,80px);font-weight:700}
.go{background:var(--accent);color:var(--on-accent);padding:18px 30px;border-radius:18px;font-size:26px;font-weight:700;box-shadow:var(--shadow)}
.hint{color:var(--muted);font-size:15px;text-align:center;margin:0}
.tri{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.tri div{border-radius:18px;padding:10px;min-height:60px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;font-size:28px}
.tri .m{background:var(--mas-soft)}.tri .f{background:var(--fem-soft)}
.tri h3{width:100%;margin:0 0 4px;font-size:16px}
.tri .m h3{color:var(--mas)}.tri .f h3{color:var(--fem)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <a class="home" href="../../../index.html#cp">← CP</a>
  <h1>👫 Masculin ou féminin ?</h1>
  <div class="seg" role="group" aria-label="Écriture">
    <button id="fScript" class="on">script</button>
    <button id="fCursive" class="cur">cursive</button>
  </div>
</header>
<main id="main"></main>
<script src="../../../assets/reglages.js?v=3"></script>
<script>
/*
  Les noms : [mot, emoji, "m" ou "f"].
  Un mot qui commence par une voyelle (âne, épée, île…) donne « l' » : il ne sert que pour un / une et il / elle.
  Pour en ajouter : une ligne de plus, avec "m" (un, le, il) ou "f" (une, la, elle).
*/
const NOMS = [
  ["rat","🐀","m"], ["nid","🪺","m"], ["piano","🎹","m"], ["stylo","🖊️","m"], ["parasol","⛱️","m"], ["lit","🛏️","m"],
  ["ananas","🍍","m"], ["renard","🦊","m"], ["os","🦴","m"], ["pot","🪴","m"], ["pirate","🏴‍☠️","m"], ["trésor","💰","m"],
  ["tipi","⛺","m"], ["riz","🍚","m"], ["âne","🐴","m"], ["papier","📄","m"], ["chat","🐱","m"], ["chien","🐶","m"],
  ["livre","📕","m"], ["ballon","⚽","m"], ["vélo","🚲","m"], ["gâteau","🎂","m"], ["poisson","🐟","m"], ["arbre","🌳","m"],
  ["tortue","🐢","f"], ["tulipe","🌷","f"], ["pelote","🧶","f"], ["pile","🔋","f"], ["tarte","🥧","f"], ["épée","🗡️","f"],
  ["télé","📺","f"], ["lune","🌙","f"], ["rose","🌹","f"], ["tasse","☕","f"], ["note","🎵","f"], ["pie","🐦","f"],
  ["lapine","🐇","f"], ["île","🏝️","f"], ["pomme","🍎","f"], ["maison","🏠","f"], ["fleur","🌸","f"], ["voiture","🚗","f"],
  ["étoile","⭐","f"], ["banane","🍌","f"], ["fraise","🍓","f"], ["souris","🐭","f"], ["vache","🐄","f"], ["poule","🐔","f"]
];
/* Les trois paires de mots vedettes */
const PAIRES = { un:["un","une"], le:["le","la"], il:["il","elle"] };
const KEY = "cp-genre-v1";
const $ = s => document.querySelector(s);
const lsGet = k => { try { return localStorage.getItem(k) } catch(e) { return null } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v) } catch(e) {} };
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]] } return a };
const voyelle = w => /^[aeéèêiîoôuâh]/i.test(w);
function speak(t){ try{ const u=new SpeechSynthesisUtterance(t); u.lang="fr-FR"; u.rate=.8; speechSynthesis.cancel(); speechSynthesis.speak(u) }catch(e){} }
function buzz(){ try{ navigator.vibrate&&navigator.vibrate(15) }catch(e){} }

const R = Reglages.init({ key: KEY, onChange: () => partie(), niveaux: {
  facile: "Un ou une ? Avec l'image et le mot.",
  moyen: "Un / une ou le / la, mélangés.",
  difficile: "Un / une, le / la, et il / elle dans une phrase : « tortue → ___ est sur le tapis »." } });
const T = () => R().questions;

function setLook(c){ document.body.classList.toggle("cursive",c); $("#fScript").classList.toggle("on",!c); $("#fCursive").classList.toggle("on",c);
  let l={}; try{ l=JSON.parse(lsGet("lecture-adrien-v1-look"))||{} }catch(e){} l.cursive=c; lsSet("lecture-adrien-v1-look",JSON.stringify(l)) }
try{ setLook(!!(JSON.parse(lsGet("lecture-adrien-v1-look"))||{}).cursive) }catch(e){ setLook(false) }
$("#fScript").onclick=()=>setLook(false); $("#fCursive").onclick=()=>setLook(true);

/* une question = un nom + une paire (un/une, le/la ou il/elle) */
function question(nom){
  const niv=R().niveau;
  let types = niv==="facile" ? ["un"] : niv==="moyen" ? ["un","le"] : ["un","le","il","il"];
  if (voyelle(nom[0])) types = types.filter(t=>t!=="le");   // « l'âne » : pas de le / la
  return { nom, type: types[Math.floor(Math.random()*types.length)] };
}
function phrase(q, rempli){
  const [mot] = q.nom, i = q.nom[2]==="m"?0:1, art = PAIRES[q.type][i];
  const trou = rempli ? '<span class="trou '+(i?"fem":"mas")+'">'+(q.type==="il"?art[0].toUpperCase()+art.slice(1):art)+'</span>' : '<span class="trou">?</span>';
  if (q.type==="il") return '<span style="font-size:.6em;color:var(--muted)">'+mot+' →</span><br>'+trou+' est sur le tapis.';
  return trou+' '+mot;
}
const dire = q => { const i=q.nom[2]==="m"?0:1, a=PAIRES[q.type][i]; return q.type==="il" ? a+" est sur le tapis" : a+" "+q.nom[0] };

let jeu;
function etoiles(){ return '<div class="stars">'+Array.from({length:T()},(_,i)=>'<span class="'+(i<jeu.tour?(jeu.res[i]?"on":""):(i===jeu.tour?"cur":""))+'">⭐</span>').join("")+'</div>' }
function partie(){
  Reglages.stop();
  let pioche=[]; while (pioche.length<T()) pioche.push(...shuffle(NOMS.slice()));
  jeu={ tour:0, res:[], liste:pioche.slice(0,T()).map(question), tri:{m:[],f:[]} };
  tour();
}
function tour(){
  if (jeu.tour>=T()) return fin();
  const q=jeu.liste[jeu.tour], bon=q.nom[2]; let essai=0;
  const [m,f]=PAIRES[q.type];
  $("#main").innerHTML = etoiles() +
    '<p class="consigne">'+(q.type==="il" ? "Pour ce mot, on dit il ou elle ?" : "Quel petit mot va devant ?")+'</p>' +
    '<div class="carte"><div class="pic">'+q.nom[1]+'</div><div class="phrase" id="ph">'+phrase(q,false)+'</div></div>' +
    '<div class="choix"><button class="m" data-g="m"><b>'+m+'</b><small>masculin</small></button><button class="f" data-g="f"><b>'+f+'</b><small>féminin</small></button></div>' +
    '<p class="astuce" id="astuce"></p>' +
    '<div class="tools"><button class="pill" id="bSay">🔊 Écouter le mot</button></div>';
  $("#bSay").onclick=()=>speak(q.nom[0]);
  const btns=[...document.querySelectorAll(".choix button")];
  const fini=(ok)=>{
    $("#ph").innerHTML=phrase(q,true); btns.forEach(b=>{ b.disabled=true; if(b.dataset.g===bon) b.classList.add("ok") });
    const g = bon==="m" ? '<b class="m">masculin</b>' : '<b class="f">féminin</b>';
    $("#astuce").innerHTML = 'On dit « '+dire(q).replace(/^./,c=>c.toUpperCase())+' » : « '+q.nom[0]+' » est '+g+'.';
    if (R().son) speak(dire(q));
    jeu.res[jeu.tour]=ok; jeu.tri[bon].push(q.nom[1]); jeu.tour++; setTimeout(tour, ok?1600:2600);
  };
  Reglages.chrono(()=>fini(false));
  btns.forEach(b=>b.onclick=()=>{
    if (b.dataset.g===bon){ Reglages.stop(); buzz(); fini(essai===0) }
    else { essai++; b.classList.remove("bad"); void b.offsetWidth; b.classList.add("bad"); speak(b.querySelector("b").textContent+" "+(q.type==="il"?"est sur le tapis":q.nom[0])+" ?") }
  });
}
function fin(){
  const T_=T(), n=jeu.res.filter(Boolean).length, k=KEY+"-best-"+R().niveau, best=Math.max(n,+(lsGet(k)||0)); lsSet(k,best);
  const msg = n===T_ ? "Parfait ! 🎉" : n>=T_*.7 ? "Très bien !" : n>=T_/2 ? "Bien !" : "On continue !";
  $("#main").innerHTML='<div class="end"><h2>'+msg+'</h2><div class="big">'+n+' / '+T_+' ⭐</div>'+
    '<div class="tri"><div class="m"><h3>Masculin · un, le, il</h3>'+jeu.tri.m.join("")+'</div><div class="f"><h3>Féminin · une, la, elle</h3>'+jeu.tri.f.join("")+'</div></div>'+
    '<p class="hint">Trouvés du premier coup · Record : '+best+' / '+T_+'</p><button class="go" id="bAgain">▶ Rejouer</button></div>';
  $("#bAgain").onclick=partie;
}
partie();
</script>
</body>
</html>
