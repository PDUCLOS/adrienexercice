<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mes dictées · CP</title>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Playwrite+FR+Moderne:wght@400&display=swap" rel="stylesheet">
<style>
/* Refaire les dictées de la classe : mot par mot, syllabe par syllabe, avec une aide ciblée sur les erreurs faites en classe */
:root{
  --bg:#f6f3ec; --panel:#ffffff; --ink:#1f2328; --muted:#6b6f76; --line:#d9d4c7; --chip:#efeadf;
  --tile:#e7f1fc; --tile-ink:#1c7ed6; --cur:#fff3bf; --cur-ink:#e67700; --mute:#adb5bd;
  --ok:#d3f9d8; --ok-ink:#2b8a3e; --err:#ffe3e3; --err-ink:#c92a2a; --accent:#2f9e44; --on-accent:#ffffff;
  --shadow:0 2px 10px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1b1d21; --panel:#26292e; --ink:#eceef1; --muted:#a3a8b0; --line:#3a3e45; --chip:#33373d;
    --tile:#1d2d3d; --tile-ink:#4dabf7; --cur:#3d3412; --cur-ink:#ffd43b; --mute:#6b7178;
    --ok:#1e3a26; --ok-ink:#8ce99a; --err:#4a1f22; --err-ink:#ffa8a8; --accent:#37b24d;
    --shadow:0 2px 10px rgba(0,0,0,.4); color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Andika",system-ui,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none;
  display:flex;flex-direction:column;min-height:100vh;padding-block:12px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--tile-ink);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
header h1{font-size:22px;margin:0 auto 0 0}
.home,.pill{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:12px;background:var(--chip);font-weight:700;font-size:17px;text-decoration:none;color:inherit}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--chip);border-radius:12px;padding:4px}
.seg button{padding:8px 12px;border-radius:9px;font-size:16px;font-weight:700;background:transparent}
.seg button.on{background:var(--panel);box-shadow:var(--shadow)}
.seg .cur{font-family:"Playwrite FR Moderne","Andika",cursive;font-weight:400;font-size:14px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.4vh,22px);padding-top:10px;width:min(100%,1000px);margin:0 auto}
.listes{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.listes button{padding:10px 14px;border-radius:12px;background:var(--chip);font-weight:700;font-size:16px}
.listes button.on{background:var(--accent);color:var(--on-accent)}
.listes button .n{font-size:13px;opacity:.85}
.stars{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-size:clamp(20px,3.4vw,28px)}
.stars span{opacity:.2}.stars span.on{opacity:1}.stars span.cur{opacity:.6}
.consigne{font-size:clamp(18px,2.6vw,24px);color:var(--muted);margin:0;text-align:center}
.listen{background:var(--accent);color:var(--on-accent);border-radius:50%;width:clamp(76px,12vh,104px);height:clamp(76px,12vh,104px);font-size:clamp(34px,5.6vh,48px);box-shadow:var(--shadow)}
.slots{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:clamp(14px,2.4vw,26px);background:var(--panel);border-radius:22px;padding:clamp(12px,2.4vh,22px) clamp(14px,2.4vw,26px);box-shadow:var(--shadow);max-width:100%}
.mot{display:flex;gap:clamp(8px,1.4vw,14px)}
.syl{display:flex;gap:3px;padding:4px;border-radius:12px}
.syl.cur{background:var(--cur);outline:3px solid var(--cur-ink)}
.case{min-width:clamp(40px,6.4vh,58px);height:clamp(56px,9vh,80px);border-radius:12px;border:3px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:clamp(36px,6vh,56px);font-weight:700;background:var(--bg)}
.case.f{border-style:solid;border-color:var(--tile-ink);color:var(--tile-ink);background:var(--panel)}
.case.fix{border:0;background:transparent;min-width:14px}
.mot.ok .case.f{background:var(--ok);color:var(--ok-ink);border-color:var(--ok-ink)}
.slots.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(8px,1.4vw,14px);max-width:900px}
.tile{background:var(--tile);color:var(--tile-ink);border-radius:16px;min-width:clamp(58px,9vh,80px);padding:clamp(8px,1.8vh,16px) 12px;font-size:clamp(32px,5.4vh,50px);font-weight:700;box-shadow:var(--shadow)}
.tile.used{visibility:hidden}
body.cursive .case,body.cursive .tile,body.cursive .modele{font-family:"Playwrite FR Moderne","Andika",cursive;font-weight:400}
.aide{min-height:1.6em;font-size:clamp(17px,2.3vw,21px);text-align:center;margin:0;color:var(--err-ink);font-weight:700}
.modele{font-size:clamp(44px,8vh,76px);font-weight:700;color:var(--ok-ink)}
.modele .m{color:var(--mute)}
.tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.end{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.end h2{font-size:clamp(28px,5vw,42px);margin:0}
.big{font-size:clamp(46px,8vw,76px);font-weight:700}
.go{background:var(--accent);color:var(--on-accent);padding:16px 28px;border-radius:18px;font-size:24px;font-weight:700;box-shadow:var(--shadow)}
.hint{color:var(--muted);font-size:15px;text-align:center;margin:0}
.bilan{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:760px}
.bilan span{padding:6px 12px;border-radius:10px;font-weight:700;font-size:18px}
.bilan .ok{background:var(--ok);color:var(--ok-ink)}.bilan .ko{background:var(--err);color:var(--err-ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <a class="home" href="../../../index.html#cp">← CP</a>
  <h1>📒 Mes dictées</h1>
  <div class="seg" role="group" aria-label="Écriture">
    <button id="fScript" class="on">script</button>
    <button id="fCursive" class="cur">cursive</button>
  </div>
</header>
<main id="main"></main>
<script src="../../../assets/reglages.js?v=5"></script>
<script src="../../../assets/illus.js?v=5"></script>
<script>
/*
  LES DICTÉES DE LA CLASSE. Pour en ajouter une : copier un bloc.
  Chaque mot : [écriture découpée, raté en classe ?]
    - les mots sont séparés par une espace, les syllabes par un tiret : "un pi-ra-te"
    - [x] = lettre muette (affichée en gris à la fin)
    - 1 = mot raté sur le cahier → il revient dans « Mes erreurs » jusqu'à 2 réussites de suite
*/
const DICTEES = [
  { id:"22-09", titre:"22 sept.", mots:[["bon-jour"],["li"],["op"],["ul"],["at",1],["pi-pe"],["pa-pa",1]] },
  { id:"29-09", titre:"29 sept.", mots:[["ap"],["ul"],["un"],["u-ne"],["la"],["tu-li-pe",1],["pé-ta-le",1],["le lo-to"]] },
  { id:"08-10", titre:"8 oct.",   mots:[["sa",1],["il y a"],["el-le"],["lui"],["u-ne pa-ro-le",1],["un pi-ra-te",1],["u-ne tas-se",1],["un é-pi",1]] },
  { id:"13-10", titre:"13 oct.",  mots:[["or"],["is"],["il y a"],["pour",1],["c'est",1],["sur"],["un pa-ra-sol",1],["le tis-su"],["le pi-lo-te",1],["l'o-pé-ra"]] },
  { id:"05-11", titre:"5 nov.",   mots:[["bon-jour",1],["il y a"],["pour"],["u-ne"],["sur"],["el-le"],["lui"],["la"],["dans"],["est"]] },
  /* PROGRESSION d'après le manuel (leçons 44 à 50) : syllabes → mots → petite phrase */
  { id:"p1", prog:1, titre:"① ge gi gue gui", mots:[["ge"],["gi"],["gue"],["gui"],["la gi-ra-fe"],["la ba-gue"],["le ma-nè-ge"],["la gui-ta-re"],["le pi-geon"],["la gi-ra-fe est i-ci"]] },
  { id:"p2", prog:1, titre:"② s = z", mots:[["ise"],["ose"],["la mai-son"],["la chai-se"],["un bi-sou"],["la ce-ri-se"],["la tas-se"],["ar-ro-ser"],["il y a u-ne chai-se dans la mai-son"]] },
  { id:"p3", prog:1, titre:"③ ié ion", mots:[["pia"],["ion"],["le ca-mion"],["le pia-no"],["la ri-viè-re"],["le pie[d]"],["un a-vion"],["le lion"],["sou-dain le lion sau-te"]] },
  { id:"p4", prog:1, titre:"④ eil ill", mots:[["eil"],["euil"],["le so-leil"],["le ré-veil"],["u-ne bil-le"],["l'é-cu-reuil"],["le tra-vail"],["l'a-beil-le"],["l'a-beil-le est sur la feuil-le"]] },
  { id:"p5", prog:1, titre:"⑤ y", mots:[["ya"],["yo"],["le yé-ti"],["le cra-yon"],["ro-yal"],["le ya-ourt"],["le vo-ya-ge"],["le yé-ti ne man-ge ja-mais"]] },
  { id:"p6", prog:1, titre:"⑥ gn", mots:[["gna"],["gno"],["la mon-ta-gne"],["le cy-gne"],["u-ne li-gne"],["l'a-gneau"],["le pei-gne"],["le cham-pi-gnon"],["l'a-gneau est sur la mon-ta-gne"]] },
  { id:"p7", prog:1, titre:"⑦ ien oin oui", mots:[["ien"],["oin"],["le chien"],["bien"],["rien"],["le coin"],["un point"],["oui"],["le chien est dans le coin"]] },
  { id:"p8", prog:1, titre:"⑧ mots outils", mots:[["i-ci"],["là"],["a-vec"],["sans"],["moi"],["toi"],["tou-jours"],["ja-mais"],["les"],["sont"],["les chiens sont i-ci"]] }
];
/* Aides ciblées, d'après les erreurs du cahier */
const ASTUCES = [
  { si: m => /\bune?\b/.test(m), quand: (bon, tape) => bon==="u" && tape==="n",
    dire: "Attention ! Dans un et une, on entend d'abord u, puis n. On écrit u, puis n." },
  { si: m => /ou/.test(m), quand: (bon) => bon==="u",
    dire: "Le son ou s'écrit avec deux lettres : o, puis u." },
  { si: m => /c'est/.test(m), quand: () => true,
    dire: "C'est est un mot vedette : c, apostrophe, e, s, t. Il ne s'écrit pas comme il s'entend." }
];
const KEY = "cp-mes-dictees-v1";
const $ = s => document.querySelector(s);
const lsGet = k => { try { return localStorage.getItem(k) } catch(e) { return null } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v) } catch(e) {} };
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]] } return a };
const plain = s => s.replace(/[-\[\]]/g,"");
const html = s => plain(s.replace(/\[(.+?)\]/g,"§$1¤")).replace(/§(.+?)¤/g,'<span class="m">$1</span>');
const fixe = c => c===" " || c==="'";
function buzz(){ try{ navigator.vibrate&&navigator.vibrate(15) }catch(e){} }

const R = Reglages.init({ key: KEY, champs:["niveau","chrono","son","questions"], onChange: () => partie(), niveaux: {
  facile: "La tablette dit chaque syllabe au moment de l'écrire. Seulement les lettres du mot.",
  moyen: "La tablette dit le mot ; la syllabe à écrire est montrée. 2 lettres pièges (dont u / n).",
  difficile: "Comme en classe : le mot est dit, pas d'aide syllabe par syllabe. 4 lettres pièges." } });

function setLook(c){ document.body.classList.toggle("cursive",c); $("#fScript").classList.toggle("on",!c); $("#fCursive").classList.toggle("on",c);
  let l={}; try{ l=JSON.parse(lsGet("lecture-adrien-v1-look"))||{} }catch(e){} l.cursive=c; lsSet("lecture-adrien-v1-look",JSON.stringify(l)) }
try{ setLook(!!(JSON.parse(lsGet("lecture-adrien-v1-look"))||{}).cursive) }catch(e){ setLook(false) }
$("#fScript").onclick=()=>setLook(false); $("#fCursive").onclick=()=>setLook(true);

/* suivi : chaque mot raté en classe reste « à revoir » jusqu'à 2 réussites de suite sans erreur */
let suivi = (()=>{ try{ return JSON.parse(lsGet(KEY+"-suivi"))||{} }catch(e){ return {} } })();
const saveSuivi = () => lsSet(KEY+"-suivi", JSON.stringify(suivi));
const cle = m => plain(m[0]);
function aRevoir(){
  const vus=new Set(), out=[];
  DICTEES.forEach(d=>d.mots.forEach(m=>{ const k=cle(m), s=suivi[k];
    const rate = (m[1] && !(s && s.serie>=2)) || (s && s.ko>0 && s.serie<2);
    if (rate && !vus.has(k)){ vus.add(k); out.push(m) } }));
  return out;
}
let choix = "erreurs", jeu;

function barre(){
  const n=aRevoir().length;
  return '<div class="listes">'+
    '<button data-l="erreurs" class="'+(choix==="erreurs"?"on":"")+'">🎯 Mes erreurs <span class="n">('+n+')</span></button>'+
    DICTEES.filter(d=>!d.prog).map(d=>'<button data-l="'+d.id+'" class="'+(choix===d.id?"on":"")+'">'+d.titre+'</button>').join("")+'</div>'+
    '<div class="listes">'+DICTEES.filter(d=>d.prog).map(d=>{
      const fait = d.mots.every(m=>{ const s=suivi[cle(m)]; return s && s.ok>0 });   // ✓ quand chaque mot a été réussi une fois
      return '<button data-l="'+d.id+'" class="'+(choix===d.id?"on":"")+'">'+d.titre+(fait?" ✓":"")+'</button>' }).join("")+'</div>';
}
function brancherBarre(){ document.querySelectorAll(".listes button").forEach(b=>b.onclick=()=>{ choix=b.dataset.l; partie() }) }

function partie(){
  Reglages.stop(); try{ speechSynthesis.cancel() }catch(e){}
  let liste = choix==="erreurs" ? shuffle(aRevoir()).slice(0, R().questions) : DICTEES.find(d=>d.id===choix).mots.slice();
  if (!liste.length){
    $("#main").innerHTML = barre()+'<div class="end"><h2>Plus aucune erreur à revoir ! 🎉</h2><p class="hint">Tous les mots ratés en classe ont été réussis 2 fois de suite. Choisis une dictée pour t\'entraîner encore.</p></div>';
    return brancherBarre();
  }
  jeu = { liste, tour:0, res:[], gen:(jeu?jeu.gen:0)+1 };
  $("#main").innerHTML = barre()+'<p class="consigne">'+(choix==="erreurs"?"Les mots que tu as ratés en classe. ":"La dictée du "+DICTEES.find(d=>d.id===choix).titre+". ")+'Écoute, puis écris avec les lettres.</p><button class="go" id="bGo">▶ Commencer</button>';
  brancherBarre();
  $("#bGo").onclick=()=>question();   // un premier toucher est nécessaire pour que la tablette parle
}
function etoiles(){ return '<div class="stars">'+jeu.liste.map((_,i)=>'<span class="'+(i<jeu.tour?(jeu.res[i]?"on":""):(i===jeu.tour?"cur":""))+'">⭐</span>').join("")+'</div>' }

function question(){
  if (jeu.tour>=jeu.liste.length) return fin();
  const g=jeu.gen, m=jeu.liste[jeu.tour], texte=m[0], dit=plain(texte);
  const niv=R().niveau;
  // structure : mots → syllabes → lettres (les lettres muettes [x] s'écrivent aussi)
  const mots = texte.split(" ").map(w=>w.split("-").map(s=>[...s.replace(/[\[\]]/g,"")]));
  const lettres = mots.flat(2).filter(c=>!fixe(c));
  let pos=0, erreurs=0;
  const idxSyl = (() => { const out=[]; let k=0; mots.forEach((w,wi)=>w.forEach((s,si)=>{ s.forEach(c=>{ if(!fixe(c)) out.push([wi,si]) }) })); return out })();
  const nbPieges = niv==="facile"?0:niv==="moyen"?2:4;
  const pieges=[];
  if (nbPieges && /u/.test(dit) && !/n/.test(dit)) pieges.push("n");
  if (nbPieges && /n/.test(dit) && !/u/.test(dit)) pieges.push("u");
  shuffle("aeiouéplrstnmd".split("").filter(c=>!lettres.includes(c)&&!pieges.includes(c))).forEach(c=>{ if(pieges.length<nbPieges) pieges.push(c) });
  const tuiles = shuffle([...lettres, ...pieges]);
  $("#main").innerHTML = etoiles() +
    '<div class="tools"><button class="listen" id="bSay" aria-label="Réécouter">🔊</button></div>' +
    '<div class="slots" id="slots"></div><p class="aide" id="aide"></p>' +
    '<div class="tiles">'+tuiles.map((c,i)=>'<button class="tile" data-i="'+i+'">'+c+'</button>').join("")+'</div>' +
    '<div class="tools"><button class="pill" id="bSyl">🔊 La syllabe</button><button class="pill" id="bQuit">← Changer de dictée</button></div>';
  const sylCourante = () => { if (pos>=lettres.length) return null; const [wi,si]=idxSyl[pos]; return mots[wi][si].join("") };
  const draw = () => {
    let k=0;
    $("#slots").innerHTML = mots.map((w,wi)=>{
      const fin = idxSyl.findIndex(([a])=>a>wi), complet = fin===-1 ? pos>=lettres.length : pos>=fin;
      return '<div class="mot'+(complet?" ok":"")+'">'+w.map((s,si)=>{
        const cur = niv!=="difficile" && pos<lettres.length && idxSyl[pos][0]===wi && idxSyl[pos][1]===si;
        return '<div class="syl'+(cur?" cur":"")+'">'+s.map(c=>{ if (fixe(c)) return '<div class="case fix">'+(c==="'"?"'":"")+'</div>';
          const i=k++; return '<div class="case'+(i<pos?" f":"")+'">'+(i<pos?lettres[i]:"")+'</div>' }).join("")+'</div>' }).join("")+'</div>' }).join("");
  };
  const direSyl = () => { const s=sylCourante(); if (s) Reglages.parler(s, "consigne") };
  draw();
  $("#bSay").onclick = () => Reglages.parler(dit, "consigne");
  $("#bSyl").onclick = () => { erreurs += niv==="difficile" ? 1 : 0; direSyl() };
  $("#bQuit").onclick = () => partie();
  Reglages.parler(dit, "consigne");
  if (niv==="facile") setTimeout(()=>{ if (jeu.gen===g) direSyl() }, 1400);
  const finir = ok => {
    Reglages.stop();
    const s = suivi[cle(m)] || (suivi[cle(m)]={ok:0,ko:0,serie:0});
    if (ok){ s.ok++; s.serie++ } else { s.ko++; s.serie=0 } saveSuivi();
    jeu.res[jeu.tour]=ok; jeu.tour++;
    document.querySelectorAll(".tile").forEach(t=>t.disabled=true);
    $("#aide").innerHTML = '<span class="modele">'+html(texte)+'</span>';
    Reglages.parler(dit, ok ? "succes" : "erreur");
    setTimeout(()=>{ if (jeu.gen===g) question() }, ok ? 1500 : 3200);
  };
  Reglages.chrono(()=>finir(false));
  document.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{
    if (pos>=lettres.length) return;
    const c=t.textContent, bon=lettres[pos];
    if (c===bon){
      buzz(); t.classList.add("used"); pos++; $("#aide").textContent=""; draw();
      if (pos===lettres.length) return finir(erreurs===0);
      // en Facile, on dit la syllabe suivante dès qu'on y arrive
      if (niv==="facile" && idxSyl[pos].join()!==idxSyl[pos-1].join()) direSyl();
      return;
    }
    erreurs++;
    const s=$("#slots"); s.classList.remove("bad"); void s.offsetWidth; s.classList.add("bad");
    const astuce = ASTUCES.find(a=>a.si(dit) && a.quand(bon,c));
    const msg = astuce ? astuce.dire : "Non, pas "+c+". Écoute bien : "+sylCourante()+".";
    $("#aide").textContent = astuce ? astuce.dire : "Pas « "+c+" ». Écoute la syllabe : « "+sylCourante()+" »";
    Reglages.parler(msg, "erreur");
  });
}
function fin(){
  const n=jeu.res.filter(Boolean).length, T_=jeu.liste.length;
  const msg = n===T_ ? "Parfait ! 🎉" : n>=T_*.7 ? "Très bien !" : n>=T_/2 ? "Bien !" : "On continue !";
  $("#main").innerHTML = barre()+'<div class="end"><h2>'+msg+'</h2><div class="big">'+n+' / '+T_+' ⭐</div>'+
    '<div class="bilan">'+jeu.liste.map((m,i)=>'<span class="'+(jeu.res[i]?"ok":"ko")+'">'+plain(m[0])+'</span>').join("")+'</div>'+
    '<p class="hint">En vert : réussi sans erreur. Un mot raté en classe quitte « Mes erreurs » après 2 réussites de suite.</p>'+
    '<button class="go" id="bAgain">▶ Recommencer</button></div>';
  brancherBarre(); $("#bAgain").onclick=partie;
}
partie();
</script>
</body>
</html>
