<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lettres et chiffres miroirs · CP</title>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Confusions en miroir : b/d/p/q, 6/9, chiffres écrits à l'envers. Trois activités + astuces. */
:root{
  --bg:#f6f3ec; --panel:#ffffff; --ink:#1f2328; --muted:#6b6f76; --line:#d9d4c7; --chip:#efeadf;
  --b:#1971c2; --b-soft:#e7f1fc; --d:#e8590c; --d-soft:#fff0e6;
  --ok:#d3f9d8; --ok-ink:#2b8a3e; --err:#ffe3e3; --err-ink:#c92a2a; --accent:#0c8599; --on-accent:#ffffff;
  --shadow:0 2px 10px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1b1d21; --panel:#26292e; --ink:#eceef1; --muted:#a3a8b0; --line:#3a3e45; --chip:#33373d;
    --b:#4dabf7; --b-soft:#1d2d3d; --d:#ff922b; --d-soft:#3a2a1c;
    --ok:#1e3a26; --ok-ink:#8ce99a; --err:#4a1f22; --err-ink:#ffa8a8; --accent:#22b8cf;
    --shadow:0 2px 10px rgba(0,0,0,.4); color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Andika",system-ui,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none;
  display:flex;flex-direction:column;min-height:100vh;padding-block:12px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
header h1{font-size:22px;margin:0 auto 0 0}
.home,.pill{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:12px;background:var(--chip);font-weight:700;font-size:17px;text-decoration:none;color:inherit}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--chip);border-radius:12px;padding:4px}
.seg button{padding:8px 12px;border-radius:9px;font-size:16px;font-weight:700;background:transparent}
.seg button.on{background:var(--panel);box-shadow:var(--shadow)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,2.6vh,24px);padding-top:10px;width:min(100%,1000px);margin:0 auto}
.stars{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-size:clamp(20px,3.6vw,30px)}
.stars span{opacity:.2}.stars span.on{opacity:1}.stars span.cur{opacity:.6}
.consigne{font-size:clamp(18px,2.6vw,24px);color:var(--muted);margin:0;text-align:center}
.consigne b{color:var(--ink);font-size:1.4em}
/* Endroit / envers */
.glyphe{background:var(--panel);border-radius:28px;box-shadow:var(--shadow);width:clamp(180px,32vh,280px);height:clamp(180px,32vh,280px);display:flex;align-items:center;justify-content:center;
  font-size:clamp(130px,24vh,210px);font-weight:700;line-height:1}
.glyphe span{display:inline-block}
.glyphe .miroir{transform:scaleX(-1)}
.glyphe .tete{transform:rotate(180deg)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2.4vw,24px);width:min(100%,720px)}
.duo button{border-radius:24px;padding:clamp(14px,2.6vh,24px) 10px;font-size:clamp(24px,3.4vw,34px);font-weight:700;box-shadow:var(--shadow);background:var(--panel);border:4px solid var(--line)}
.duo button.ok,.tile.ok,.choix button.ok{background:var(--ok);color:var(--ok-ink);border-color:var(--ok-ink)}
.duo button.bad,.tile.bad,.choix button.bad{background:var(--err);color:var(--err-ink);border-color:var(--err-ink);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* Chasse */
.grille{display:grid;gap:clamp(6px,1.2vw,12px);width:min(100%,900px)}
.tile{background:var(--panel);border:3px solid var(--line);border-radius:16px;aspect-ratio:1/1;font-size:clamp(34px,6vh,60px);font-weight:700;box-shadow:var(--shadow);max-width:100%}
.tile.ok{transform:scale(.92)}
.compteur{font-size:20px;font-weight:700}
/* b ou d */
.carte{background:var(--panel);border-radius:28px;box-shadow:var(--shadow);padding:clamp(12px,2.6vh,24px) clamp(20px,4vw,44px);display:flex;flex-direction:column;align-items:center;gap:4px}
.pic{font-size:clamp(90px,17vh,160px);line-height:1}
.mot{font-size:clamp(46px,7vw,76px);font-weight:700;letter-spacing:.02em}
.trou{display:inline-block;min-width:.9em;text-align:center;border-bottom:6px solid var(--accent);color:var(--accent)}
.choix{display:flex;gap:clamp(10px,2vw,20px);justify-content:center;flex-wrap:wrap}
.choix button{width:clamp(90px,15vh,130px);height:clamp(90px,15vh,130px);border-radius:24px;font-size:clamp(56px,10vh,90px);font-weight:700;background:var(--panel);border:4px solid var(--line);box-shadow:var(--shadow)}
.cb{color:var(--b)}.cd{color:var(--d)}
/* astuces */
.astuce{background:var(--panel);border-radius:20px;box-shadow:var(--shadow);padding:16px 20px;font-size:clamp(18px,2.4vw,22px);max-width:760px;display:none}
.astuce.on{display:block}
.astuce p{margin:.3em 0}
.astuce .big{font-size:1.8em;font-weight:700}
.tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.end{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.end h2{font-size:clamp(30px,5vw,44px);margin:0}
.big{font-size:clamp(50px,9vw,80px);font-weight:700}
.go{background:var(--accent);color:var(--on-accent);padding:18px 30px;border-radius:18px;font-size:26px;font-weight:700;box-shadow:var(--shadow)}
.hint{color:var(--muted);font-size:15px;text-align:center;margin:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <a class="home" href="../../../index.html#cp">← CP</a>
  <h1>🪞 b, d, 6, 9… à l'endroit !</h1>
  <div class="seg" role="group" aria-label="Activité" id="modes">
    <button data-m="sens" class="on">🔄 Endroit ou envers ?</button>
    <button data-m="chasse">🔍 Chasse</button>
    <button data-m="mots">📝 b ou d ?</button>
  </div>
</header>
<main id="main"></main>
<script src="../../../assets/reglages.js?v=5"></script>
<script src="../../../assets/illus.js?v=5"></script>
<script>
const KEY = "cp-miroir-v1";
const $ = s => document.querySelector(s);
const lsGet = k => { try { return localStorage.getItem(k) } catch(e) { return null } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v) } catch(e) {} };
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]] } return a };
function speak(t){ try{ const u=new SpeechSynthesisUtterance(t); u.lang="fr-FR"; u.rate=.8; speechSynthesis.cancel(); speechSynthesis.speak(u) }catch(e){} }
function buzz(){ try{ navigator.vibrate&&navigator.vibrate(15) }catch(e){} }

const R = Reglages.init({ key: KEY, onChange: () => setMode(mode), niveaux: {
  facile: "Endroit/envers : 6, 2, 3 · Chasse : b parmi les d (12 cases) · Mots : b ou d au début du mot.",
  moyen: "Endroit/envers : tous les chiffres et des lettres · Chasse : b, d, p, q (20 cases) · Mots : b ou d partout dans le mot.",
  difficile: "Endroit/envers : aussi la tête en bas · Chasse : lettres et 6/9 mélangés (30 cases) · Mots : b, d, p ou q." } });
const T = () => R().questions;
const niv = () => R().niveau;

/* ---------- Astuces (bouton 💡) ---------- */
const ASTUCES = {
  bd: '<p class="big"><span class="cb">b</span> <span class="cd">d</span> = 🛏️</p><p>Les deux mains font un <b>lit</b> : pouce en l\'air, la main gauche fait <span class="cb"><b>b</b></span>, la main droite fait <span class="cd"><b>d</b></span>.</p><p><span class="cb"><b>b</b></span> : d\'abord le grand bâton, puis le ventre. <span class="cd"><b>d</b></span> : d\'abord le rond (comme un <b>c</b>), puis le bâton.</p>',
  pq: '<p><b>p</b> et <b>q</b> descendent sous la ligne. <b>p</b> : le bâton, puis le ventre (comme <b>b</b> qui plonge). <b>q</b> : le rond d\'abord (comme <b>d</b> qui plonge).</p>',
  chiffres: '<p class="big">6 · 9</p><p><b>6</b> : on part d\'en haut, on descend, et la boucle est en <b>bas</b> (comme un escargot qui rentre).</p><p><b>9</b> : la boucle est en <b>haut</b>, puis on descend tout droit.</p><p>Les chiffres « regardent » vers la droite : 2, 3, 7 ont le ventre ou le nez à droite.</p>'
};
function astuceHtml(keys){ return '<div class="astuce" id="astuce">'+keys.map(k=>ASTUCES[k]).join("")+'</div>' }
function boutonAstuce(){ const b=$("#bAst"); if(b) b.onclick=()=>$("#astuce").classList.toggle("on") }

let mode="sens", jeu;
function etoiles(){ return '<div class="stars">'+Array.from({length:T()},(_,i)=>'<span class="'+(i<jeu.tour?(jeu.res[i]?"on":""):(i===jeu.tour?"cur":""))+'">⭐</span>').join("")+'</div>' }
function suivant(ok, delai){ Reglages.stop(); jeu.res[jeu.tour]=ok; jeu.tour++; setTimeout(()=>jeu.tour>=T()?fin():ACT[mode](), delai||1100) }
function fin(){
  const T_=T(), n=jeu.res.filter(Boolean).length, k=KEY+"-best-"+mode+"-"+niv(), best=Math.max(n,+(lsGet(k)||0)); lsSet(k,best);
  const msg = n===T_ ? "Parfait ! 🎉" : n>=T_*.7 ? "Très bien !" : n>=T_/2 ? "Bien !" : "On continue !";
  $("#main").innerHTML='<div class="end"><h2>'+msg+'</h2><div class="big">'+n+' / '+T_+' ⭐</div><p class="hint">Réussis du premier coup · Record : '+best+' / '+T_+'</p><button class="go" id="bAgain">▶ Rejouer</button></div>';
  $("#bAgain").onclick=()=>setMode(mode);
}
function rater(b){ b.classList.remove("bad"); void b.offsetWidth; b.classList.add("bad") }

const ACT = {
  /* 1. ENDROIT OU ENVERS : le signe est-il bien écrit ? (pas de b/d/p/q ici : à l'envers, ils deviennent une autre lettre) */
  sens(){
    const signes = niv()==="facile" ? ["6","2","3","6"] : ["2","3","4","5","6","7","9","a","e","r","s","z","f","j","k"];
    const [s, envers] = jeu.neuf(() => [pick(signes), Math.random()<.5]);   // pas deux fois le même signe dans le même sens
    const forme = !envers ? "" : (niv()==="difficile" && !["6","9"].includes(s) && Math.random()<.4 ? "tete" : "miroir");
    let essai=0;
    $("#main").innerHTML = etoiles() + '<p class="consigne">Ce signe est-il écrit <b>à l\'endroit</b> ?</p>' +
      '<div class="glyphe"><span class="'+forme+'">'+s+'</span></div>' +
      '<div class="duo"><button data-v="0">👍 À l\'endroit</button><button data-v="1">🔄 À l\'envers</button></div>' +
      '<div class="tools"><button class="pill" id="bAst">💡 Astuce</button></div>' + astuceHtml(["chiffres"]);
    boutonAstuce();
    const btns=[...document.querySelectorAll(".duo button")], bon=envers?"1":"0";
    const montrer=()=>{ btns.forEach(x=>{ x.disabled=true; if(x.dataset.v===bon) x.classList.add("ok") }); if(envers){ const g=$(".glyphe span"); setTimeout(()=>{ g.style.transition="transform .6s"; g.className="" },500) } };
    Reglages.chrono(()=>{ montrer(); suivant(false,1800) });
    btns.forEach(b=>b.onclick=()=>{ if(b.dataset.v===bon){ buzz(); montrer(); suivant(essai===0, envers?1600:1000) } else { essai++; rater(b); Reglages.parler(envers?"Non, regarde bien : ce signe est retourné, comme dans un miroir.":"Non, regarde bien : ce signe est bien écrit, il est à l'endroit.","erreur") } });
  },
  /* 2. CHASSE : toucher toutes les cases avec le signe demandé */
  chasse(){
    const n = niv(), cible = n==="difficile" ? pick(["b","d","p","q","6","9"]) : n==="moyen" ? pick(["b","d","p","q"]) : pick(["b","d"]);   // la grille change à chaque fois
    const famille = /\d/.test(cible) ? ["6","9"] : ["b","d","p","q"];
    const pieges = n==="facile" ? [cible==="b"?"d":"b"] : n==="moyen" ? famille.filter(x=>x!==cible) : ["b","d","p","q","6","9"].filter(x=>x!==cible);
    const total = n==="facile" ? 12 : n==="moyen" ? 20 : 30, nb = Math.round(total*.3);
    const cases = shuffle([...Array(nb).fill(cible), ...Array.from({length:total-nb},()=>pick(pieges))]);
    const cols = total===12 ? 4 : total===20 ? 5 : 6;
    let trouves=0, erreurs=0;
    /* la lettre n'est pas écrite : on l'entend (son + mot exemple), il faut la retrouver */
    $("#main").innerHTML = etoiles() + '<p class="consigne">Écoute bien, puis touche toutes les cases qui font ce son</p>' +
      '<button class="pill" id="bSon" style="font-size:24px;padding:14px 24px">🔊 Réécouter</button>' +
      '<div class="grille" style="grid-template-columns:repeat('+cols+',minmax(0,1fr));max-width:'+(cols*120)+'px">'+cases.map(c=>'<button class="tile" data-c="'+c+'">'+c+'</button>').join("")+'</div>' +
      '<div class="tools"><span class="pill compteur" id="cpt">0 / '+nb+'</span><button class="pill" id="bAst">💡 Astuce</button></div>' + astuceHtml(/\d/.test(cible)?["chiffres"]:["bd","pq"]);
    boutonAstuce();
    const dire = () => speak(SONS[cible]); $("#bSon").onclick = dire; setTimeout(dire, 300);
    Reglages.chrono(()=>{ document.querySelectorAll(".tile").forEach(t=>{ t.disabled=true; if(t.dataset.c===cible) t.classList.add("ok") }); suivant(false,1800) });
    document.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{
      if (t.dataset.c===cible){ t.classList.add("ok"); t.disabled=true; buzz(); trouves++; $("#cpt").textContent=trouves+" / "+nb;
        if (trouves===nb){ document.querySelectorAll(".tile").forEach(x=>x.disabled=true); suivant(erreurs===0,1200) } }
      else { erreurs++; rater(t); Reglages.parler(SONS[t.dataset.c].split(",")[0]+" ? Non. Écoute : "+SONS[cible],"erreur") }
    });
  },
  /* 3. b OU d ? : compléter le mot illustré */
  mots(){
    const n = niv();
    const liste = MOTS.filter(m => n==="difficile" ? true : (/[bd]/.test(m.l)) && (n==="moyen" || m.debut));
    const m = jeu.neuf(() => pick(liste), x => x.mot);
    const choix = n==="difficile" ? ["b","d","p","q"] : ["b","d"];
    let essai=0;
    $("#main").innerHTML = etoiles() + '<p class="consigne">Quelle lettre manque ?</p>' +
      '<div class="carte"><div class="pic">'+m.e+'</div><div class="mot">'+m.mot.replace("_",'<span class="trou" id="trou">?</span>')+'</div></div>' +
      '<div class="choix">'+choix.map(c=>'<button data-c="'+c+'" class="'+(c==="b"?"cb":c==="d"?"cd":"")+'">'+c+'</button>').join("")+'</div>' +
      '<div class="tools"><button class="pill" id="bSay">🔊 Écouter le mot</button><button class="pill" id="bAst">💡 Astuce</button></div>' + astuceHtml(n==="difficile"?["bd","pq"]:["bd"]);
    boutonAstuce();
    const complet = m.mot.replace("_",m.l);
    $("#bSay").onclick=()=>speak(complet); setTimeout(()=>Reglages.parler(complet,"consigne"),300);
    const btns=[...document.querySelectorAll(".choix button")];
    const montrer=()=>{ const t=$("#trou"); t.textContent=m.l; btns.forEach(x=>{ x.disabled=true; if(x.dataset.c===m.l) x.classList.add("ok") }) };
    Reglages.chrono(()=>{ montrer(); suivant(false,1800) });
    btns.forEach(b=>b.onclick=()=>{ if(b.dataset.c===m.l){ buzz(); montrer(); suivant(essai===0,1300) } else { essai++; rater(b); Reglages.parler("Non : "+m.mot.replace("_",b.dataset.c)+", ça ne se dit pas comme ça. Écoute : "+complet+".","erreur") } });
  }
};
/* Ce que dit la tablette pour chaque signe : le son, puis un mot qui commence par ce son */
const SONS = { b:"beu, comme dans ballon", d:"de, comme dans dé", p:"peu, comme dans papa", q:"keu, comme dans coq", "6":"six", "9":"neuf" };
/* Mots illustrés : _ = la lettre à trouver ; debut = la lettre est au début du mot */
const MOTS = [
  {mot:"_allon",l:"b",e:"⚽",debut:1},{mot:"_anane",l:"b",e:"🍌",debut:1},{mot:"_ateau",l:"b",e:"⛵",debut:1},{mot:"_us",l:"b",e:"🚌",debut:1},
  {mot:"_ougie",l:"b",e:"🕯️",debut:1},{mot:"_iberon",l:"b",e:"🍼",debut:1},{mot:"_ébé",l:"b",e:"👶",debut:1},{mot:"_ol",l:"b",e:"🥣",debut:1},
  {mot:"_é",l:"d",e:"🎲",debut:1},{mot:"_inosaure",l:"d",e:"🦕",debut:1},{mot:"_auphin",l:"d",e:"🐬",debut:1},{mot:"_ragon",l:"d",e:"🐉",debut:1},
  {mot:"_ent",l:"d",e:"🦷",debut:1},{mot:"_ouche",l:"d",e:"🚿",debut:1},{mot:"_ix",l:"d",e:"🔟",debut:1},{mot:"_onut",l:"d",e:"🍩",debut:1},
  {mot:"ro_e",l:"b",e:"👗"},{mot:"ar_re",l:"b",e:"🌳"},{mot:"zè_re",l:"b",e:"🦓"},{mot:"ca_ane",l:"b",e:"🛖"},{mot:"ro_ot",l:"b",e:"🤖"},
  {mot:"sala_e",l:"d",e:"🥗"},{mot:"ca_eau",l:"d",e:"🎁"},{mot:"ron_e",l:"d",e:"⭕"},{mot:"mon_e",l:"d",e:"🌍"},
  {mot:"_omme",l:"p",e:"🍎",debut:1},{mot:"_oisson",l:"p",e:"🐟",debut:1},{mot:"_izza",l:"p",e:"🍕",debut:1},{mot:"lou_e",l:"p",e:"🔍"},
  {mot:"_uille",l:"q",e:"🎳",debut:1},{mot:"co_",l:"q",e:"🐓"},{mot:"cin_",l:"q",e:"5️⃣"},
  /* en plus */
  {mot:"_aleine",l:"b",e:"🐋",debut:1},{mot:"_outeille",l:"b",e:"🍾",debut:1},{mot:"_onbon",l:"b",e:"🍬",debut:1},{mot:"_ague",l:"b",e:"💍",debut:1},
  {mot:"_alai",l:"b",e:"🧹",debut:1},{mot:"_ouche",l:"b",e:"👄",debut:1},{mot:"_ras",l:"b",e:"💪",debut:1},{mot:"_iche",l:"b",e:"🦌",debut:1},
  {mot:"co_ra",l:"b",e:"🐍"},{mot:"ar_re",l:"b",e:"🌲"},
  {mot:"_inde",l:"d",e:"🦃",debut:1},{mot:"_rapeau",l:"d",e:"🚩",debut:1},{mot:"_iamant",l:"d",e:"💎",debut:1},{mot:"_romadaire",l:"d",e:"🐪",debut:1},
  {mot:"_anseuse",l:"d",e:"💃",debut:1},{mot:"_oigt",l:"d",e:"☝️",debut:1},{mot:"pan_a",l:"d",e:"🐼"},{mot:"ra_io",l:"d",e:"📻"},
  
  {mot:"_ain",l:"p",e:"🍞",debut:1},{mot:"_oire",l:"p",e:"🍐",debut:1},{mot:"_ingouin",l:"p",e:"🐧",debut:1},{mot:"_orte",l:"p",e:"🚪",debut:1},{mot:"lam_e",l:"p",e:"💡"},
  {mot:"_uatre",l:"q",e:"4️⃣",debut:1},{mot:"mas_ue",l:"q",e:"🎭"}
];

function setMode(m){
  mode=m; Reglages.stop(); try{ speechSynthesis.cancel() }catch(e){}
  document.querySelectorAll("#modes button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
  jeu={ tour:0, res:[], neuf:Reglages.sansDoublon() }; ACT[m]();
}
document.querySelectorAll("#modes button").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
setMode("sens");
</script>
</body>
</html>
